[project]
name = "xiaod"
version = "0.1.0"
description = "飞书音视频转录整理 Agent（LangGraph + Vue/FastAPI）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langsmith>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "python-dotenv>=1.0.0",
    "lark-oapi>=1.4.0",
    "yt-dlp>=2025.1.0",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.28.0"]

[project.scripts]
xiaod = "xiaod.cli:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
